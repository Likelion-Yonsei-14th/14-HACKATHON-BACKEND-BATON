spring:
  application:
    name: baton

  datasource:
    url: ${BATON_DB_URL:jdbc:postgresql://localhost:5432/baton}
    username: ${BATON_DB_USERNAME:baton}
    password: ${BATON_DB_PASSWORD:baton}
    hikari:
      maximum-pool-size: ${BATON_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

server:
  port: ${BATON_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
